plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

def playKeystorePath = System.getenv("PLAY_STORE_KEYSTORE_PATH")
def playKeystorePassword = System.getenv("PLAY_STORE_KEYSTORE_PASSWORD")
def playKeyAlias = System.getenv("PLAY_STORE_KEY_ALIAS")
def playKeyPassword = System.getenv("PLAY_STORE_KEY_PASSWORD")
def hasPlaySigning = playKeystorePath && file(playKeystorePath).exists() &&
  playKeystorePassword && playKeyAlias && playKeyPassword

android {
  namespace "com.learnwithchampak.tv"
  compileSdk 36

  defaultConfig {
    applicationId "com.learnwithchampak.tv"
    minSdk 21
    targetSdk 36
    versionCode 35
    versionName "3.0.1"
  }

  signingConfigs {
    if (hasPlaySigning) {
      release {
        storeFile file(playKeystorePath)
        storePassword playKeystorePassword
        keyAlias playKeyAlias
        keyPassword playKeyPassword
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
      if (hasPlaySigning) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.browser:browser:1.8.0"
}
