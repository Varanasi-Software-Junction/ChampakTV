<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PP TV — Offline</title>
  <style>
    :root{--bg:#fff8ef;--panel:rgba(255,255,255,.88);--ink:#1f2328;--muted:#5b6570;--saffron:#d97706;--saffron2:#f59e0b;--line:rgba(31,35,40,.10)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(1000px 500px at 10% 0%, rgba(217,119,6,.18), transparent 60%),linear-gradient(180deg,#fff8ef,#fff1d9);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
    .card{width:min(920px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 16px 44px rgba(31,35,40,.12)}
    h1{margin:0 0 10px;font-size:2rem}p{margin:10px 0 0;color:var(--muted);line-height:1.6;font-size:1.05rem}.pill{display:inline-block;margin-top:14px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  </style>
</head>
<body>
  <div class="card" tabindex="0">
    <h1>PP TV</h1>
    <p>The TV app is offline right now and could not load the online page.</p>
    <p class="pill">Check network, reopen app, and try again.</p>
  </div>
</body>
</html>
