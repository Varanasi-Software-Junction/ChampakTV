name: Build Android Play Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: champak-tv-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Bundle latest Champak photo, launcher icon and TV banner
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          curl -L "https://programmer-s-picnic.github.io/json-images/tv/champak-photo.png" -o app/src/main/assets/champak-photo.png
          cp app/src/main/assets/champak-photo.png app/src/main/res/drawable/champak_installer_icon.png
          cp app/src/main/assets/champak-photo.png app/src/main/res/drawable/app_banner_photo.png

      - name: Download Gradle 8.13
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

      - name: Prepare optional Play signing
        shell: bash
        env:
          PLAY_STORE_KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          PLAY_STORE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
          PLAY_STORE_KEY_ALIAS: ${{ secrets.PLAY_STORE_KEY_ALIAS }}
          PLAY_STORE_KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${PLAY_STORE_KEYSTORE_BASE64:-}" ]; then
            echo "$PLAY_STORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload-key.jks"
            echo "PLAY_STORE_KEYSTORE_PATH=$RUNNER_TEMP/play-upload-key.jks" >> "$GITHUB_ENV"
            echo "PLAY_STORE_KEYSTORE_PASSWORD=$PLAY_STORE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PLAY_STORE_KEY_ALIAS=$PLAY_STORE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PLAY_STORE_KEY_PASSWORD=$PLAY_STORE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Play signing key loaded."
          else
            echo "No Play signing secrets configured; release AAB will be unsigned."
          fi

      - name: Build test APK and release AAB
        run: gradle clean assembleDebug bundleRelease

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp-tv-apk-demo-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: learn-with-champak-play-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Show release outputs
        run: |
          find app/build/outputs -maxdepth 5 -type f -print

      - name: Publish large APK as GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)"
          TAG="v${VERSION_NAME}"
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          ASSET_NAME="Learn-With-Champak-Browser-${TAG}-Gecko.apk"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Learn With Champak Browser ${TAG}" \
              --notes "GeckoView browser release for Android and Android TV. Includes Windows-style browser chrome, persistent address bar, history/bookmark suggestions and in-browser Google authentication."
          fi

          cp "$APK_PATH" "$RUNNER_TEMP/$ASSET_NAME"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET_NAME" --clobber
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
