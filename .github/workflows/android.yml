name: Build Android TV APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Bundle latest Champak photo and installer icon
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          curl -L "https://programmer-s-picnic.github.io/json-images/tv/champak-photo.png" -o app/src/main/assets/champak-photo.png
          cp app/src/main/assets/champak-photo.png app/src/main/res/drawable/champak_installer_icon.png
          ls -lh app/src/main/assets/champak-photo.png
          ls -lh app/src/main/res/drawable/champak_installer_icon.png

      - name: Download Gradle 8.2
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp-tv-apk-demo-apk
          path: app/build/outputs/apk/debug/*.apk
